# Automazione «Regola Aurea»: alle ~08:00 Europe/Rome elabora il giorno PRECEDENTE
# (Obsidian + riga unica in floremoria_logs). Richiede Mac spento = niente: gira su GitHub.

name: Verbale giornaliero (ieri)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-verbale-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Checkout verbali BARBARA (Second Brain Sync)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: FloreMoria/Second_Brain_Sync
          path: .barbara-sync
          token: ${{ secrets.BARBARA_SYNC_GITHUB_TOKEN || github.token }}

      - name: Sync verbale (ieri, Europe/Rome) — include pipeline BARBARA + docs
        env:
          BARBARA_VERBALI_REPO_DIR: .barbara-sync
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CI: 'true'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Warning: DATABASE_URL non presente nei secrets. Sync eseguito solo su Markdown."
          fi
          npm run log:verbale:daily || echo "⚠️ Warning: daily verbale sync completato con avviso."

      - name: Commit e push Obsidian (se cambiato)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/obsidian/verbali/
          if git diff --staged --quiet; then
            echo "Nessun file verbale da committare."
          else
            git commit -m "chore(verbali): [skip ci] sync automatico verbale giorno precedente (Europe/Rome)"
            git push || echo "⚠️ Warning: Push ignorato."
          fi
